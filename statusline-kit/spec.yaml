schemaVersion: "2"
kind: mixin
name: statusline-kit
displayName: Claude Code statusline
description: Adds a Claude Code statusline showing the sbx sandbox name, cwd, git branch, model, context %, rate limit and session cost.

setup:
  install:
    - description: |
        Set the statusLine key in ~/.claude/settings.json to ~/.claude/statusline.sh using
        jq merge, so all other keys are preserved. Any existing statusLine is overridden.
      command: |
        set -e
        mkdir -p /home/agent/.claude
        f=/home/agent/.claude/settings.json
        [ -f "$f" ] || echo '{}' > "$f"
        # Set only the statusLine key (any existing one is replaced by design);
        # the jq merge leaves all other settings untouched. Temp file lives in the
        # same dir as $f so the mv below is an atomic rename, not a cross-fs copy.
        tmp=$(mktemp -p /home/agent/.claude)
        jq '.statusLine = {type: "command", command: "/bin/bash /home/agent/.claude/statusline.sh"}' "$f" > "$tmp"
        mv "$tmp" "$f"
      user: "1000"

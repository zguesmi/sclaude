schemaVersion: "2"
kind: mixin
name: shell-prompt-kit
displayName: Sandbox shell prompt
description: Bash prompt showing SBX, the sandbox name and the working directory, so it is obvious the shell is inside a sandbox.

commands:
  install:
    - description: |
        Append the PS1 definition to /etc/sandbox-persistent.sh, which every bash
        in the sandbox sources.
      command: |
        set -e
        cat >> /etc/sandbox-persistent.sh <<'BLOCK'
        if [ -n "${PS1-}" ]; then
            # Claude brand coral (#D97757) in a Claude sandbox,
            # neutral grey otherwise. 256-colour fallback is 173 without truecolor.
            if command -v claude >/dev/null 2>&1; then
                __sbx_name_bg='48;2;217;119;87'
            else
                __sbx_name_bg='48;5;240'
            fi
            PS1="\[\e[38;5;231;48;5;27m\] SBX \[\e[38;5;231;${__sbx_name_bg}m\] \h \[\e[38;5;252;48;5;236m\] \w \[\e[0m\] "
        fi
        BLOCK
      user: "1000"

schemaVersion: "2"
kind: mixin
name: git-guardrails-kit
displayName: Destructive git guardrails
description: Registers a Claude Code PreToolUse hook that blocks destructive git commands (force push, reset --hard, clean -f, branch -D, reflog expire, ...) inside the sandbox.

setup:
  install:
    - description: |
        Register /home/agent/.claude/hooks/git-guardrails.sh as a PreToolUse hook for Bash in
        ~/.claude/settings.json via a jq merge, so every other key (and every other hook)
        is preserved. Any earlier entry pointing at the same script is dropped first, so
        re-applying the kit does not stack duplicates.
      command: |
        set -e
        mkdir -p /home/agent/.claude/hooks
        f=/home/agent/.claude/settings.json
        [ -f "$f" ] || echo '{}' > "$f"
        path=/home/agent/.claude/hooks/git-guardrails.sh
        cmd="/bin/bash $path"
        # Dedup matches on the script path, not on the whole command string, so an
        # entry written by an older revision of this kit (bare path, no interpreter)
        # is dropped too instead of surviving next to the new one.
        # Temp file in the same dir as $f so the mv is an atomic rename.
        tmp=$(mktemp -p /home/agent/.claude)
        jq --arg path "$path" --arg cmd "$cmd" '
          .hooks //= {}
          | .hooks.PreToolUse = (
              ((.hooks.PreToolUse // [])
                | map(select(((.hooks // []) | map(.command // "")
                    | map(select(contains($path))) | length) == 0)))
              + [{matcher: "Bash", hooks: [{type: "command", command: $cmd}]}]
            )
        ' "$f" > "$tmp"
        mv "$tmp" "$f"
      user: "1000"
